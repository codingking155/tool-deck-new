name: CI

# Runs on every pull request and on pushes to main: unit tests, a production build,
# then the browser smoke tests in tests/e2e against that build. No secrets are used;
# the e2e build gets placeholder Supabase values and every external call is mocked or blocked.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # match Vercel's production build runtime
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:q
      - name: Lint
        run: npm run lint -- --quiet
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://e2e.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-placeholder
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
          npm run test:e2e
