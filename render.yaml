# Render Blueprint for the YouTube Downloader backend (FastAPI + yt-dlp + FFmpeg).
# The ToolDeck frontend stays on Vercel; it reaches this service via VITE_DOWNLOADER_API_URL.
# Setup steps: youtube-downloader/README.md → "Deploying with ToolDeck".
services:
  - type: web
    name: tooldeck-ytdl
    runtime: docker
    rootDir: youtube-downloader/backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Free plan: no cost. It sleeps after ~15 min idle (the next request waits ~1 min while it wakes)
    # and has 512 MB RAM and a fraction of a CPU, so the limits below are kept modest.
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      # Browser origins allowed to call the API (comma-separated). Add preview domains if needed.
      - key: ALLOWED_ORIGINS
        value: https://tooldeck.in,https://www.tooldeck.in,https://tool-deck-new.vercel.app
      # Render's load balancer appends one X-Forwarded-For entry.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: DOWNLOAD_DIR
        value: /tmp/tooldeck-ytdl
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "1"
      - key: MAX_QUEUED_JOBS
        value: "5"
      - key: MAX_FILESIZE_MB
        value: "1024"
      - key: MAX_DURATION_SECONDS
        value: "3600"
