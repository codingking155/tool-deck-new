  <title>How to tell if a site runs on Shopify</title>
</head>
<body>
  <article>
    <h1>How to tell if a site runs on Shopify</h1>
    <p>Open the page source and search for <code>cdn.shopify.com</code> or <code>window.Shopify</code>.</p>
    <p>Stores also have a <code>brand.myshopify.com</code> address, and assets under <code>/cdn/shop/</code>.</p>
    <pre><code>Shopify.theme = { name: "Dawn" }; ShopifyAnalytics.meta</code></pre>
  </article>
</body>
</html>
