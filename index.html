<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090F" />

  <title>ToolDeck BLR — fast, private browser utilities</title>
  <meta name="description" content="Six fast, private browser tools: UTC wait schedules, phone → country, Shopify detector, speed test, IP & IPv6, price tracker. Nothing you type is stored." />
  <link rel="canonical" href="https://tooldeck.in/" />

  <!-- Open Graph / Twitter (link unfurls on WhatsApp, Slack, X, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ToolDeck BLR" />
  <meta property="og:title" content="ToolDeck BLR — fast, private browser utilities" />
  <meta property="og:description" content="Six fast, private browser tools that run entirely in your browser. Nothing you type is stored." />
  <meta property="og:url" content="https://tooldeck.in/" />
  <meta property="og:image" content="https://tooldeck.in/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ToolDeck BLR — fast, private browser utilities" />
  <meta name="twitter:description" content="Six fast, private browser tools that run entirely in your browser." />
  <meta name="twitter:image" content="https://tooldeck.in/og.png" />

  <!-- Icons + PWA + performance hints -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- DNS prefetch for external services -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

  <!-- Fonts: async loading with fallback. Only essential fonts upfront, others deferred -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Essential display fonts only: fast render path -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" />
  <!-- Non-essential fonts loaded async after page interactive -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Raleway:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />

  <!-- Structured data so tools can earn rich results -->
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"WebSite","name":"ToolDeck BLR","url":"https://tooldeck.in/"}
  </script>

  <!-- Privacy-friendly analytics (uncomment and set your domain). No cookies, GDPR-safe.
  <script defer data-domain="tooldeck.in" src="https://plausible.io/js/script.js"></script>
  -->
</head>
<body>
  <div id="root"></div>
  <!-- Defer main app bundle to unblock page rendering -->
  <script type="module" src="/src/main.jsx" defer></script>
</body>
</html>
