<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes, minimum-scale=1" />
  <meta name="theme-color" content="#07090F" />

  <!-- iOS specific meta tags for better app-like experience -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ToolDeck" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="color-scheme" content="light dark" />

  <title>ToolDeck BLR — fast, private browser utilities</title>
  <meta name="description" content="Fast, private everyday tools: UTC wait times, phone → country, Shopify detectors, speed test, IP & IPv6 leak checks, price tracker, PDF and image tools, JSON, passwords and breach checks. Nothing you type is stored." />
  <link rel="canonical" href="https://tooldeck.in/" />

  <!-- Open Graph / Twitter (link unfurls on WhatsApp, Slack, X, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ToolDeck BLR" />
  <meta property="og:title" content="ToolDeck BLR — fast, private browser utilities" />
  <meta property="og:description" content="Fast, private everyday tools — most run entirely in your browser. Nothing you type is stored." />
  <meta property="og:url" content="https://tooldeck.in/" />
  <meta property="og:image" content="https://tooldeck.in/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ToolDeck BLR — fast, private browser utilities" />
  <meta name="twitter:description" content="Fast, private everyday tools — most run entirely in your browser." />
  <meta name="twitter:image" content="https://tooldeck.in/og.png" />

  <!-- Icons + PWA + performance hints -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- applies the saved theme before first paint (no dark flash for light-mode users) -->
  <script src="/theme-boot.js"></script>

  <!-- Structured data so tools can earn rich results -->
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"WebSite","name":"ToolDeck BLR","url":"https://tooldeck.in/"}
  </script>

  <!-- Privacy-friendly analytics (uncomment and set your domain). No cookies, GDPR-safe.
  <script defer data-domain="tooldeck.in" src="https://plausible.io/js/script.js"></script>
  -->
</head>
<body>
  <div id="root"></div>
  <!-- Defer main app bundle to unblock page rendering -->
  <script type="module" src="/src/main.jsx" defer></script>
</body>
</html>
